<!DOCTYPE html>

<html lang="uk" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <title>ООП у функціональному стилі</title>
</head>

<body>
    <script>
        function Person(name, surname, age) {
            let _name = name;
            let _surname = surname;
            let _age = age;

            this.setName = function (name) {
                if (!name) {
                    throw new Error("Значення name не визначено!");
                }
                _name = name;
            };
            this.getName = function () {
                return _name;
            };

            this.setSurname = function (surname) {
                if (!surname) {
                    throw new Error("Значення surname не визначено!");
                }
                _surname = surname;
            };
            this.getSurname = function () {
                return _surname;
            };

            this.setAge = function (age) {
                if (!age || age <= 0) {
                    throw new Error("Значення age має бути додатним!");
                }
                _age = age;
            };
            this.getAge = function () {
                return _age;
            };

            this.print = function () {
                document.write("Ім'я: " + _name + "<br />");
                document.write("Прізвище: " + _surname + "<br />");
                document.write("Вік: " + _age + "<br />");
            };
        }

        function Student(name, surname, age, rating) {
            Person.call(this, name, surname, age);

            let _rating = rating;

            this.setRating = function (rating) {
                if (!rating || rating <= 0 || rating > 12) {
                    throw new Error("Значення rating має бути в діапазоні від 1 до 12!");
                }
                _rating = rating;
            };
            this.getRating = function () {
                return _rating;
            };

            let parentPrint = this.print;
            this.print = function () {
                parentPrint();
                document.write("Рейтинг: " + _rating + "<br />");
            }
        }

        let person = new Person("Іван", "Іваненко", 25);
        person.print();
        person.setName("Петро");
        person.setSurname("Петренко");
        person.setAge(30);
        person.print();

        let student = new Student("Олексій", "Олексієнко", 27, 10.5);
        student.print();
        student.setName("Сергій");
        student.setSurname("Кузнєцов");
        student.setAge(30);
        student.setRating(12);
        student.print();
    </script>
</body>

</html>
